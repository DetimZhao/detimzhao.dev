<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>password-generator - detimzhao lab</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Commit Mono'; src: url('/fonts/commit-mono-latin-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Commit Mono'; src: url('/fonts/commit-mono-latin-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* defaults — overridden by the shared palette on load (matches landing) */
    --bg: #0a0a0a; --fg: #eef0ff; --accent: #fff3c4;
    --muted: color-mix(in srgb, var(--fg) 55%, var(--bg));
    --mono: "Commit Mono", "JetBrains Mono", ui-monospace, monospace;
    --prose: "DM Sans", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    position: relative; overflow-x: hidden;
  }
  /* ambient generative field - static, matches landing (GPU accel off) */
  .aurora {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(42% 34% at 22% 26%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 72%),
      radial-gradient(32% 28% at 80% 20%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 72%),
      radial-gradient(46% 38% at 66% 80%, color-mix(in srgb, var(--fg) 13%, transparent), transparent 78%),
      radial-gradient(28% 24% at 28% 84%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 72%);
  }
  .scanlines {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
  }
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: baseline; gap: 0.75em;
    padding: 0.9em clamp(16px, 4vw, 28px);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    border-bottom: 1px solid color-mix(in srgb, var(--fg) 16%, transparent);
  }
  .topbar a { color: var(--fg); text-decoration: none; font-weight: 700; }
  .topbar a:hover { color: var(--accent); }
  .topbar .crumb { color: var(--muted); font-weight: 400; }
  .topbar .dot { color: var(--accent); }
  main { max-width: 680px; min-height: calc(100dvh - 56px); margin: 0 auto; padding: clamp(24px, 5vh, 48px) clamp(16px, 4vw, 28px) 64px; position: relative; z-index: 1; display: flex; flex-direction: column; }
  h1 { font-size: clamp(1.5em, 4vw, 2em); font-weight: 700; letter-spacing: -0.01em; }

  /* hero: the password IS the focus */
  .hero {
    margin-top: 1.5em;
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
    border-radius: 0.7em;
    padding: 1.6em 1.2em;
    text-align: center;
  }
  .pw {
    font-size: clamp(1.5em, 5vw, 2.4em);
    font-weight: 700;
    word-break: break-all;
    line-height: 1.2;
    user-select: all;         /* click-drag selects the whole string */
    cursor: text;
    min-height: 1.3em;
  }
  .pw:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .actions { display: flex; gap: 0.7em; margin-top: 1.4em; flex-wrap: wrap; justify-content: center; }
  .actions button {
    font-family: var(--mono); font-size: 0.9em; font-weight: 700; color: var(--bg);
    background: var(--accent); border: none; border-radius: 0.55em;
    padding: 0.7em 1.3em; cursor: pointer; min-height: 44px;
    transition: opacity .15s, transform .15s;
  }
  .actions button:hover { opacity: 0.88; transform: translateY(-1px); }
  .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .actions button.ghost {
    background: transparent; color: var(--fg);
    border: 1px solid color-mix(in srgb, var(--fg) 30%, transparent); font-weight: 400;
  }
  .actions button.ghost:hover { color: var(--accent); border-color: var(--accent); }

  /* controls panel */
  .panel {
    margin-top: 1.2em;
    border: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
    border-radius: 0.7em; padding: 1.1em;
    display: grid; gap: 1.1em;
  }
  .field label { display: block; font-size: 0.78em; color: var(--muted); margin-bottom: 0.45em; letter-spacing: 0.05em; font-family: var(--prose); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
  .row .val { color: var(--accent); font-size: 0.9em; }
  .slider { flex: 1; }
  .slider input[type=range] { width: 100%; accent-color: var(--accent); min-height: 28px; }

  .classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.6em; }
  .toggle {
    display: flex; align-items: center; gap: 0.6em;
    font-family: var(--mono); font-size: 0.85em; color: var(--muted);
    background: transparent; border: 1px solid color-mix(in srgb, var(--fg) 24%, transparent);
    border-radius: 0.5em; padding: 0.6em 0.85em; cursor: pointer; min-height: 40px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .toggle:hover { color: var(--fg); }
  .toggle.on { color: var(--accent); border-color: var(--accent); }
  .toggle .box {
    width: 0.9em; height: 0.9em; flex: none; border: 1.5px solid var(--muted); border-radius: 2px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 0.8em;
  }
  .toggle.on .box { border-color: var(--accent); }
  .toggle.on .box::after { content: "✓"; color: var(--accent); }

  /* strength meter */
  .strength { display: flex; align-items: center; gap: 0.8em; }
  .meter { flex: 1; height: 0.4em; border-radius: 2px; background: color-mix(in srgb, var(--fg) 16%, transparent); overflow: hidden; }
  .meter .bar { height: 100%; width: 0; border-radius: 2px; background: var(--accent); transition: width .2s, background .2s; }
  .strength .label { font-size: 0.85em; color: var(--muted); min-width: 2.6em; text-align: right; }
  .strength .label.weak { color: #e07171; }
  .strength .label.fair { color: var(--accent); }
  .strength .label.strong { color: #7fd07f; }

  .copied {
    font-size: 0.8em; color: var(--accent); opacity: 0; transition: opacity .2s;
    pointer-events: none; margin-top: 0.8em; min-height: 1em;
  }
  .copied.show { opacity: 1; }
  .meta { margin-top: 1em; font-size: 0.8em; color: var(--muted); }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 480px) {
    .hero { padding: 1.2em 0.8em; }
    .row { flex-direction: column; align-items: flex-start; gap: 0.4em; }
  }
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="scanlines"></div>
  <div class="topbar">
    <a href="/">detimzhao<span class="dot">.</span></a>
    <span class="crumb">/</span>
    <a href="/projects/tools">tools</a>
    <span class="crumb">/</span>
    <span class="crumb">password-generator</span>
  </div>
  <main>
    <h1>password-generator</h1>

    <div class="hero">
      <div class="pw" id="pw" tabindex="0" aria-label="Generated password"></div>
      <div class="actions">
        <button type="button" id="copy">copy</button>
        <button type="button" class="ghost" id="regen">regenerate</button>
      </div>
      <div class="copied" id="copied">✓ copied</div>
    </div>

    <div class="panel">
      <div class="field">
        <div class="row">
          <label>length</label>
          <span class="val" id="lenVal">20</span>
        </div>
        <div class="slider">
          <input type="range" id="len" min="8" max="128" step="1" value="20" aria-label="Password length">
        </div>
      </div>

      <div class="field">
        <label>characters</label>
        <div class="classes" id="classes">
          <button type="button" class="toggle on" data-pool="upper" aria-pressed="true"><span class="box"></span>uppercase</button>
          <button type="button" class="toggle on" data-pool="lower" aria-pressed="true"><span class="box"></span>lowercase</button>
          <button type="button" class="toggle on" data-pool="digit" aria-pressed="true"><span class="box"></span>digits</button>
          <button type="button" class="toggle on" data-pool="sym" aria-pressed="true"><span class="box"></span>symbols</button>
        </div>
      </div>

      <div class="field">
        <label>strength</label>
        <div class="strength">
          <div class="meter"><div class="bar" id="bar"></div></div>
          <span class="label" id="strLabel">strong</span>
        </div>
      </div>
    </div>
    <div class="meta" id="verline"></div>
  </main>
<script>
  // --- share the landing's palette statically (no r/p/s controls) ---
  (function(){
    var KEY = 'detimzhao.palette';
    function apply(p){
      var s = document.documentElement.style;
      s.setProperty('--bg', p.bg); s.setProperty('--fg', p.fg); s.setProperty('--accent', p.accent);
    }
    function hsl2hex(h,s,l){ s/=100; l/=100; var k=function(n){return (n+h/30)%12}, a=s*Math.min(l,1-l), f=function(n){var v=Math.min(k(n)-3,9-k(n)); return l-a*Math.max(-1,Math.min(1,v))}; var to=function(x){return Math.round(x*255).toString(16).padStart(2,'0')}; return '#'+to(f(0))+to(f(8))+to(f(4)); }
    function gen(){
      var H = Math.random()*360|0;
      return { bg:hsl2hex(H,20+Math.random()*20,9+Math.random()*16),
               fg:hsl2hex(H,8+Math.random()*10,88+Math.random()*7),
               accent:hsl2hex((H+40+Math.random()*110)%360,58+Math.random()*30,52+Math.random()*15) };
    }
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
    if (saved && saved.bg) {
      apply(saved);
    } else {
      var p = gen();
      apply(p);
      try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e) {}
    }
  })();
</script>

<script>
  const VERSION = 'v1.0.1';   // see VERSIONING.md — single source of truth for the footer label
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var pwEl = $('pw'), classesEl = $('classes'), bar = $('bar'), strLabel = $('strLabel');

    var POOLS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      digit: '0123456789',
      sym:   '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~'
    };

    function selected(){
      return [...classesEl.querySelectorAll('.toggle.on')].map(function(t){ return t.dataset.pool; });
    }

    // unbiased crypto-random pick helper
    function pick(str){
      var bytes = new Uint32Array(1);
      crypto.getRandomValues(bytes);
      return str[bytes[0] % str.length];
    }
    function shuffle(arr){
      for (var i = arr.length - 1; i > 0; i--){
        var b = new Uint32Array(1); crypto.getRandomValues(b);
        var j = b[0] % (i + 1);
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    function entropyBits(len, poolSize){
      if (!poolSize) return 0;
      return len * Math.log2(poolSize);
    }

    function generate(){
      var pools = selected();
      if (!pools.length) return '';
      var len = parseInt($('len').value, 10);
      var combined = pools.map(function(p){ return POOLS[p]; }).join('');
      // guarantee at least one char from each selected class, then fill + shuffle
      var chars = pools.map(function(p){ return pick(POOLS[p]); });
      for (var i = chars.length; i < len; i++) chars.push(pick(combined));
      return shuffle(chars).join('');
    }

    function renderStrength(bits){
      var label, pct;
      if (bits < 40)      { label = 'weak';   pct = 25; }
      else if (bits < 75) { label = 'fair';   pct = 60; }
      else                { label = 'strong'; pct = 100; }
      strLabel.textContent = label;
      strLabel.className = 'label ' + label;
      bar.style.width = pct + '%';
    }

    function update(){
      var pools = selected();
      var len = parseInt($('len').value, 10);
      $('lenVal').textContent = len;
      var poolSize = pools.reduce(function(n,p){ return n + POOLS[p].length; }, 0);
      pwEl.textContent = generate();
      renderStrength(entropyBits(len, poolSize));
    }

    // ---- events ----
    $('len').addEventListener('input', update);

    classesEl.addEventListener('click', function(e){
      var t = e.target.closest('.toggle'); if (!t) return;
      // don't allow unchecking the last active class
      if (t.classList.contains('on') && selected().length === 1) return;
      t.classList.toggle('on');
      t.setAttribute('aria-pressed', t.classList.contains('on'));
      update();
    });

    $('regen').addEventListener('click', update);

    var copyBtn = $('copy');
    function flash(){
      $('copied').classList.add('show');
      setTimeout(function(){ $('copied').classList.remove('show'); }, 900);
    }
    copyBtn.addEventListener('click', function(){
      if (!pwEl.textContent) return;
      var text = pwEl.textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(text).then(function(){ flash(); })
                           : (function(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); flash(); }catch(e){} ta.remove(); })());
    });
    // copy-on-click on the password itself
    var pwClicked = false;
    pwEl.addEventListener('click', function(){
      if (!pwEl.textContent) return;
      var text = pwEl.textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(text).then(function(){ flash(); })
                           : (function(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); flash(); }catch(e){} ta.remove(); })());
    });

    var vl = document.getElementById('verline');
    if (vl) vl.textContent = VERSION;

    update();
  })();
</script>
</body>
</html>
