<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>password-generator - detimzhao lab</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy,key,pin,refresh" />
<style>
  @font-face { font-family: 'Commit Mono'; src: url('/fonts/commit-mono-latin-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Commit Mono'; src: url('/fonts/commit-mono-latin-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* defaults — overridden by the shared palette on load (matches landing) */
    --bg: #0a0a0a; --fg: #eef0ff; --accent: #fff3c4; --accent2: #56ee95; --accent3: #59a2ee;
    --muted: color-mix(in srgb, var(--fg) 55%, var(--bg));
    --mono: "Commit Mono", "JetBrains Mono", ui-monospace, monospace;
    --prose: "DM Sans", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    position: relative; overflow-x: hidden;
  }
  .aurora {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(42% 34% at 22% 26%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 72%),
      radial-gradient(32% 28% at 80% 20%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 72%),
      radial-gradient(46% 38% at 66% 80%, color-mix(in srgb, var(--fg) 13%, transparent), transparent 78%),
      radial-gradient(28% 24% at 28% 84%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 72%);
  }
  .scanlines {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
  }
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: baseline; gap: 0.75em;
    padding: 0.9em clamp(16px, 4vw, 28px);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    border-bottom: 1px solid color-mix(in srgb, var(--fg) 16%, transparent);
  }
  .topbar a { color: var(--fg); text-decoration: none; font-weight: 700; }
  .topbar a:hover { color: var(--accent); }
  .topbar .crumb { color: var(--muted); font-weight: 400; }
  .topbar .dot { color: var(--accent); }
  main { max-width: 680px; min-height: calc(100dvh - 56px); margin: 0 auto; padding: clamp(24px, 5vh, 48px) clamp(16px, 4vw, 28px) 64px; position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: clamp(1.5em, 4vw, 2em); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.8em; }

  /* type tabs (password / pin) — rail like 1Password */
  .tabs { display: flex; gap: 1.6em; border-bottom: 1px solid color-mix(in srgb, var(--fg) 14%, transparent); }
  .tabs button {
    font-family: var(--mono); font-size: 0.95em; font-weight: 500; color: var(--muted);
    background: none; border: none; cursor: pointer;
    padding: 0.55em 0.1em; margin-bottom: -1px;
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
    display: inline-flex; align-items: center; gap: 0.45em;
  }
  .tabs button .ti { font-family: 'Material Symbols Outlined'; font-weight: 500; font-size: 1.15em; line-height: 1; }
  .tabs button:hover { color: var(--fg); }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }

  .panel { margin-top: 1.4em; display: grid; gap: 1.4em; }

  .field > label { display: block; font-size: 0.78em; color: var(--muted); margin-bottom: 0.45em; letter-spacing: 0.05em; font-family: var(--prose); }
  /* length: slider + input side by side, number pinned right */
  .lenslider { display: flex; align-items: center; gap: 0.8em; }
  .lenslider input[type=range] { flex: 1; accent-color: var(--accent); min-height: 28px; }
  .lenslider input[type=number] {
    font-family: var(--mono); font-size: 1em; color: var(--accent);
    background: transparent; border: 1px solid color-mix(in srgb, var(--fg) 24%, transparent);
    border-radius: 0.35em; padding: 0; width: 4.4em; text-align: center; min-height: 40px;
    -moz-appearance: textfield; appearance: textfield;
  }
  .lenslider input[type=number]::-webkit-inner-spin-button,
  .lenslider input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .lenslider input[type=number]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* characters — real switch toggles (pure CSS, no package) */
  .classes { display: flex; flex-direction: column; gap: 0.5em; }
  .crow {
    display: flex; align-items: center; justify-content: space-between; gap: 1em;
    font-family: var(--mono); font-size: 0.9em; color: var(--fg);
    cursor: pointer; padding: 0.35em 0; user-select: none;
  }
  .crow .nm { color: var(--muted); transition: color .15s; }
  .crow.on .nm { color: var(--fg); }
  .sw {
    width: 2.35em; height: 1.3em; border-radius: 1em; flex: none; position: relative;
    background: color-mix(in srgb, var(--fg) 22%, transparent); transition: background .15s;
  }
  .sw::after {
    content: ""; position: absolute; top: 0.18em; left: 0.2em;
    width: 0.94em; height: 0.94em; border-radius: 50%; background: var(--fg);
    transition: left .15s, background .15s;
  }
  .crow.on .sw { background: var(--accent); }
  .crow.on .sw::after { left: 1.22em; background: var(--bg); }

  /* output */
  .hero {
    margin-top: 1.4em; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent);
    border-radius: 0; padding: 1.1em 1.2em; text-align: center;
  }
  .pw { font-size: clamp(1.5em, 5vw, 2.4em); font-weight: 700; word-break: break-all; line-height: 1.2; user-select: all; cursor: text; min-height: 1.3em; }
  .pw:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .pw .acc { color: var(--accent2); }    /* digits -> accent2 */
  .pw .acc2 { color: var(--accent3); }   /* symbols -> accent3 */
  .copyhint {
    position: absolute; top: 0.55em; right: 0.65em; z-index: 2;
    background: transparent; border: none; cursor: pointer; padding: 0.3em;
    color: var(--accent); font-family: 'Material Symbols Outlined'; font-weight: 500;
    font-size: 1.3em; line-height: 1; opacity: 0; transition: opacity .18s, color .18s;
  }
  .hero:hover .copyhint, .hero:focus-within .copyhint { opacity: 1; }
  .copyhint:hover { opacity: 1 !important; color: var(--fg); }

  /* strength — always BELOW the password */
  .strengthfield { margin-top: 1em; }
  .strength { display: flex; align-items: center; gap: 0.8em; }
  .meter { flex: 1; height: 0.4em; border-radius: 2px; background: color-mix(in srgb, var(--fg) 16%, transparent); overflow: hidden; }
  .meter .bar { height: 100%; width: 0; border-radius: 2px; background: var(--accent); transition: width .2s, background .2s; }
  .strength .label { font-size: 0.85em; color: var(--muted); min-width: 2.6em; text-align: right; }
  .strength .label.weak { color: #e07171; }
  .strength .label.fair { color: var(--accent); }
  .strength .label.strong { color: #7fd07f; }

  /* actions: copy + regenerate, full-width stacked rows */
  .actions { margin-top: 1em; display: flex; flex-direction: column; gap: 0.6em; }
  .actions button {
    width: 100%; font-family: var(--mono); font-size: 0.95em; font-weight: 700;
    color: var(--bg); background: var(--accent); border: none; border-radius: 0.35em;
    padding: 0.8em; cursor: pointer; min-height: 48px; text-align: center;
    transition: opacity .15s, transform .15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
  }
  .actions button .bi { font-family: 'Material Symbols Outlined'; font-weight: 500; font-size: 1.25em; line-height: 1; }
  .actions button:hover { opacity: 0.9; transform: translateY(-1px); }
  .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .actions button.ghost {
    background: transparent; color: var(--fg);
    border: 1px solid color-mix(in srgb, var(--fg) 30%, transparent); font-weight: 500;
  }
  .actions button.ghost:hover { color: var(--accent); border-color: var(--accent); }
  .copied { text-align: center; font-size: 0.8em; color: var(--accent); opacity: 0; transition: opacity .2s; pointer-events: none; min-height: 1.2em; margin-top: 0.4em; }
  .copied.show { opacity: 1; }

  .meta { margin-top: 1em; font-size: 0.8em; color: var(--muted); }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 480px) {
    .hero { padding: 1.1em 0.8em; }
  }
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="scanlines"></div>
  <div class="topbar">
    <a href="/">detimzhao<span class="dot">.</span></a>
    <span class="crumb">/</span>
    <a href="/projects/tools">tools</a>
    <span class="crumb">/</span>
    <span class="crumb">password-generator</span>
  </div>
  <main>
    <h1>password-generator</h1>

    <div class="tabs" id="typeSeg" role="tablist" aria-label="Password type">
      <button type="button" role="tab" aria-selected="true" data-type="password" class="on"><span class="ti material-symbols-outlined" aria-hidden="true">key</span>password</button>
      <button type="button" role="tab" aria-selected="false" data-type="pin"><span class="ti material-symbols-outlined" aria-hidden="true">pin</span>pin</button>
    </div>

    <div class="panel">
      <div class="field">
        <label>length</label>
        <div class="lenslider">
          <input type="range" id="len" min="6" max="128" step="1" value="20" aria-label="Password length">
          <input type="number" id="lenInput" min="4" max="128" step="1" value="20" aria-label="Password length (type a number)">
        </div>
      </div>

      <div class="field" id="classesField">
        <label>characters</label>
        <div class="classes" id="classes">
          <label class="crow on" data-pool="upper"><span class="nm">uppercase</span><span class="sw"></span></label>
          <label class="crow on" data-pool="lower"><span class="nm">lowercase</span><span class="sw"></span></label>
          <label class="crow on" data-pool="digit"><span class="nm">digits</span><span class="sw"></span></label>
          <label class="crow on" data-pool="sym"><span class="nm">symbols</span><span class="sw"></span></label>
        </div>
      </div>
    </div>

    <div class="hero">
      <button type="button" class="copyhint material-symbols-outlined" id="copyIcon" aria-label="Copy password" title="Copy">content_copy</button>
      <div class="pw" id="pw" tabindex="0" aria-label="Generated password"></div>
    </div>

    <div class="field strengthfield" id="strengthField">
      <div class="strength">
        <div class="meter"><div class="bar" id="bar"></div></div>
        <span class="label" id="strLabel">strong</span>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="copy"><span class="bi material-symbols-outlined" aria-hidden="true">content_copy</span>copy</button>
      <button type="button" class="ghost" id="regen"><span class="bi material-symbols-outlined" aria-hidden="true">refresh</span>regenerate</button>
    </div>
    <div class="copied" id="copied">✓ copied</div>
    <div class="meta" id="verline"></div>
  </main>
<script>
  // --- share the landing's palette statically (no r/p/s controls) ---
  (function(){
    var KEY = 'detimzhao.palette';
    function apply(p){
      var s = document.documentElement.style;
      s.setProperty('--bg', p.bg); s.setProperty('--fg', p.fg); s.setProperty('--accent', p.accent);
      var a2 = p.accent2 || rotHue(p.accent, 165);   // digits
      var a3 = p.accent3 || rotHue(p.accent, 250);   // symbols
      s.setProperty('--accent2', a2); s.setProperty('--accent3', a3);
    }
    function hsl2hex(h,s,l){ s/=100; l/=100; var k=function(n){return (n+h/30)%12}, a=s*Math.min(l,1-l), f=function(n){var v=Math.min(k(n)-3,9-k(n)); return l-a*Math.max(-1,Math.min(1,v))}; var to=function(x){return Math.round(x*255).toString(16).padStart(2,'0')}; return '#'+to(f(0))+to(f(8))+to(f(4)); }
    function hex2hsl(hx){
      var r=parseInt(hx.slice(1,3),16)/255, g=parseInt(hx.slice(3,5),16)/255, b=parseInt(hx.slice(5,7),16)/255;
      var mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn, h=0, s=0;
      if(d!==0){ s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
        if(mx===r) h=((g-b)/d + (g<b?6:0)); else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; }
      return [h, s*100, l*100];
    }
    function rotHue(hex, deg){ var hs=hex2hsl(hex); return hsl2hex((hs[0]+deg)%360, hs[1], hs[2]); }
    function gen(){
      var H = Math.random()*360|0;
      var accent = hsl2hex((H+40+Math.random()*110)%360,58+Math.random()*30,52+Math.random()*15);
      return { bg:hsl2hex(H,20+Math.random()*20,9+Math.random()*16),
               fg:hsl2hex(H,8+Math.random()*10,88+Math.random()*7),
               accent:accent,
               accent2:rotHue(accent,165), accent3:rotHue(accent,250) };
    }
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
    if (saved && saved.bg) { apply(saved); }
    else { var p = gen(); apply(p); try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e) {} }
  })();
</script>

<script>
  const VERSION = 'v3.0.1';   // see VERSIONING.md — single source of truth for the footer label
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var pwEl = $('pw'), classesEl = $('classes'), bar = $('bar'), strLabel = $('strLabel');
    var classesField = $('classesField'), strengthField = $('strengthField');
    var lenEl = $('len'), lenInput = $('lenInput');
    var mode = 'password';   // 'password' | 'pin'

    var POOLS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      digit: '0123456789',
      sym:   '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~'
    };

    function selected(){
      return [...classesEl.querySelectorAll('.crow.on')].map(function(t){ return t.dataset.pool; });
    }

    function pick(str){
      var bytes = new Uint32Array(1);
      crypto.getRandomValues(bytes);
      return str[bytes[0] % str.length];
    }
    function shuffle(arr){
      for (var i = arr.length - 1; i > 0; i--){
        var b = new Uint32Array(1); crypto.getRandomValues(b);
        var j = b[0] % (i + 1);
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    function entropyBits(len, poolSize){ return poolSize ? len * Math.log2(poolSize) : 0; }

    function generate(){
      var len = parseInt(lenEl.value, 10);
      if (mode === 'pin') { var s=''; for(var i=0;i<len;i++) s+=pick(POOLS.digit); return s; }
      var pools = selected();
      if (!pools.length) return '';
      var combined = pools.map(function(p){ return POOLS[p]; }).join('');
      var chars = pools.map(function(p){ return pick(POOLS[p]); });
      for (var i = chars.length; i < len; i++) chars.push(pick(combined));
      return shuffle(chars).join('');
    }

    function renderStrength(bits){
      var label, pct;
      if (bits < 40)      { label = 'weak';   pct = 25; }
      else if (bits < 75) { label = 'fair';   pct = 60; }
      else                { label = 'strong'; pct = 100; }
      strLabel.textContent = label;
      strLabel.className = 'label ' + label;
      bar.style.width = pct + '%';
    }

    function renderPw(str){
      var out = '';
      for (var i = 0; i < str.length; i++){
        var ch = str[i];
        if (/[0-9]/.test(ch)) out += '<span class="acc">' + ch + '</span>';
        else if (!/[A-Za-z0-9]/.test(ch)) out += '<span class="acc2">' + ch + '</span>';
        else out += ch;
      }
      pwEl.innerHTML = out;
    }

    function update(){
      var len = parseInt(lenEl.value, 10);
      lenInput.value = len; lenInput.min = lenEl.min; lenInput.max = lenEl.max;
      var poolSize = mode === 'pin' ? POOLS.digit.length
                                    : selected().reduce(function(n,p){ return n + POOLS[p].length; }, 0);
      renderPw(generate());
      renderStrength(entropyBits(len, poolSize));
    }

    function setMode(m){
      mode = m;
      var isPin = m === 'pin';
      $('typeSeg').querySelectorAll('[role=tab]').forEach(function(b){
        var on = b.dataset.type === m;
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      classesField.style.display = isPin ? 'none' : '';
      if (strengthField) strengthField.style.display = isPin ? 'none' : '';
      if (isPin) { lenEl.min = 4; lenEl.max = 12; lenEl.value = 4; }
      else { lenEl.min = 6; lenEl.max = 128; lenEl.value = 20; }
      lenInput.min = lenEl.min; lenInput.max = lenEl.max; lenInput.value = lenEl.value;
      update();
    }

    // ---- events ----
    $('len').addEventListener('input', update);
    lenInput.addEventListener('input', function(){
      var v = parseInt(lenInput.value, 10);
      if (isNaN(v)) return;
      var minV = parseInt(lenEl.min, 10), maxV = parseInt(lenEl.max, 10);
      if (v < minV) v = minV; else if (v > maxV) v = maxV;
      lenEl.value = v;
      update();
    });

    $('typeSeg').addEventListener('click', function(e){
      var b = e.target.closest('[role=tab]'); if (!b) return;
      setMode(b.dataset.type);
    });

    classesEl.addEventListener('click', function(e){
      var t = e.target.closest('.crow'); if (!t) return;
      if (t.classList.contains('on') && selected().length === 1) return;
      t.classList.toggle('on');
      update();
    });

    $('regen').addEventListener('click', update);

    var copyBtn = $('copy');
    function flash(){
      $('copied').classList.add('show');
      setTimeout(function(){ $('copied').classList.remove('show'); }, 900);
    }
    function copyPw(){
      if (!pwEl.textContent) return;
      var text = pwEl.textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(text).then(function(){ flash(); })
                           : (function(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); flash(); }catch(e){} ta.remove(); })());
    }
    copyBtn.addEventListener('click', copyPw);
    var copyIcon = $('copyIcon');
    if (copyIcon) copyIcon.addEventListener('click', copyPw);
    pwEl.addEventListener('click', copyPw);

    var vl = document.getElementById('verline');
    if (vl) vl.textContent = VERSION;

    update();
  })();
</script>
</body>
</html>
